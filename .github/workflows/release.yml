name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate version files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not valid semver"
            exit 1
          fi

          lock_version() {
            awk '
              /^name = "inskea"$/ { found = 1; next }
              found && /^version = "/ {
                gsub(/^version = "|"$/, "", $0)
                print
                exit
              }
            ' "$1"
          }

          desktop_manifest=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          tauri_config=$(jq -r '.version' src-tauri/tauri.conf.json)
          readme_version=$(sed -n 's/.*badge\/version-\([^-"]*\)-blue.*/\1/p' README.md | head -n1)
          root_lock=$(lock_version Cargo.lock)
          desktop_lock=$(lock_version src-tauri/Cargo.lock)

          check() {
            if [ "$1" != "$2" ]; then
              echo "::error::$3 is '$1', expected '$2'"
              exit 1
            fi
          }

          check "$desktop_manifest" "$version" "src-tauri/Cargo.toml"
          check "$tauri_config" "$version" "src-tauri/tauri.conf.json"
          check "$readme_version" "$version" "README.md badge"
          check "$root_lock" "$version" "Cargo.lock"
          check "$desktop_lock" "$version" "src-tauri/Cargo.lock"

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Minor/major bumps release automatically. Patch bumps are left for a
          # manual workflow dispatch.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run; releasing $tag."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${version##*.}" = "0" ]; then
            echo "New minor or major version; releasing $tag."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Patch version $tag requires a manual workflow run; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  clippy:
    name: Clippy
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            curl \
            wget \
            file \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: trunk build --release
      - name: Clippy (frontend)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (desktop)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: [version, clippy]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact: windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - name: Debian
            os: ubuntu-22.04
            bundle: deb
            artifact: debian
            path: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            curl \
            wget \
            file \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Build Arch Linux
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debian
          path: artifacts/debian
      - name: Package Arch Linux bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p arch-out
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$PWD/packaging/arch:/pkg:ro" \
            -v "$PWD/artifacts/debian:/artifacts:ro" \
            -v "$PWD/LICENSE:/LICENSE:ro" \
            -v "$PWD/arch-out:/out" \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed dpkg zstd
              id -u builder >/dev/null 2>&1 || useradd -m builder
              mkdir -p /tmp/inskea
              sed "s/^pkgver=.*/pkgver=${VERSION}/" /pkg/PKGBUILD > /tmp/inskea/PKGBUILD
              cp /artifacts/*.deb /tmp/inskea/inskea.deb
              cp /LICENSE /tmp/inskea/LICENSE
              chown -R builder:builder /tmp/inskea
              su - builder -c "cd /tmp/inskea && makepkg --nodeps --noconfirm --force"
              cp /tmp/inskea/*.pkg.tar.zst /out/
            '
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: arch-out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [version, clippy, build, arch]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          previous_tag=$(git tag --list 'v*' --sort=-version:refname | grep -vx "v$VERSION" | head -n1 || true)
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..HEAD"
          else
            previous_bump=$(git log --format=%H -G '^version = ' -- Cargo.toml | sed -n '2p')
            if [ -n "$previous_bump" ]; then
              range="$previous_bump..HEAD"
            else
              range="HEAD"
            fi
          fi

          subjects=$(git log "$range" --no-merges --pretty=format:%s)
          features=$(printf '%s\n' "$subjects" | grep -E '^feat(\([^)]*\))?:' | sed -E 's/^feat(\([^)]*\))?: //' || true)
          fixes=$(printf '%s\n' "$subjects" | grep -E '^fix(\([^)]*\))?:' | sed -E 's/^fix(\([^)]*\))?: //' || true)

          {
            echo "**Target:** Windows (.exe), Debian (.deb), Arch Linux (.pkg.tar.zst)"
            echo
            echo "## Features"
            if [ -n "$features" ]; then
              printf '%s\n' "$features" | sed 's/^/- /'
            else
              echo "- No feature changes."
            fi
            echo
            echo "## Fixes"
            if [ -n "$fixes" ]; then
              printf '%s\n' "$fixes" | sed 's/^/- /'
            else
              echo "- No fixes."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="v$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit=$(git rev-list -n1 "$tag")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag points at $tagged_commit, not $GITHUB_SHA"
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
          fi

          git push origin "$tag"

          gh release create "$tag" dist/* \
            --title "Inskea $tag" \
            --notes-file release-notes.md \
            --verify-tag
